server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Health check for Docker, CI service containers and test-suite warm-up
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Build info: {"version":"1.0.0","commit":"<sha>"}
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Fingerprinted assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static "API" and frame pages: real files only, never the SPA fallback
    location /api/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /frames/ {
        try_files $uri =404;
    }

    # Single-page app: every other path renders index.html (deep links like /ch/fr/shop)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
