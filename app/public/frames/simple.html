<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple frame</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 12px; color: #1f2937; background: #f8fafc; }
      input, button { font: inherit; padding: 6px 10px; }
      button { background: #4f46e5; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h3>Inside the iframe</h3>
    <label>Your name <input id="frame-name" data-testid="frame-name" /></label>
    <button type="button" data-testid="frame-greet" onclick="greet()">Greet</button>
    <p id="frame-output" data-testid="frame-output"></p>
    <script>
      function greet() {
        var name = document.getElementById('frame-name').value || 'stranger';
        document.getElementById('frame-output').textContent = 'Hello, ' + name + '!';
      }
    </script>
  </body>
</html>
